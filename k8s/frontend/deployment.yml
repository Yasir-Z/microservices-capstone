apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:

        - name: frontend

          image: shepherd777/frontend:v2
          imagePullPolicy: Always

          ports:
            - containerPort: 80

        - name: nginx-exporter

          image: nginx/nginx-prometheus-exporter:1.4.0
          args:
            - "-nginx.scrape-uri=http://127.0.0.1/nginx_status"

          ports:
            - containerPort: 9113

          resources:

            requests:
              cpu: "50m"
              memory: "64Mi"

            limits:
              cpu: "100m"
              memory: "128Mi"
