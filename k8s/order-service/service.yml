apiVersion: v1
kind: Service

metadata:
  name: order-service
  namespace: production

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5003"

  labels:
    app: order-service


spec:

  type: ClusterIP

  selector:
    app: order-service


  ports:

    - port: 5003
      targetPort: 5003
      protocol: TCP
