apiVersion: v1
kind: Service

metadata:
  name: user-service
  namespace: production

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5001"

  labels:
    app: user-service


spec:
  type: ClusterIP

  selector:
    app: user-service

  ports:
    - port: 5001
      targetPort: 5001
      protocol: TCP
